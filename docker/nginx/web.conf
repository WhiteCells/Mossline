server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;

    # Docker DNS 动态解析，API 或 Admin 重建后无需重启入口服务
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8081;
    set $admin_upstream http://admin:80;
    include /etc/nginx/mossline-proxy.conf;

    # 上传大小由 API 的 MOSSLINE_STORAGE_MAX_UPLOAD_BYTES 校验，代理不额外限制
    client_max_body_size 0;

    location = /admin {
        return 308 /admin/;
    }

    location /admin/ {
        proxy_pass $admin_upstream$request_uri;
    }

    location ~ ^/(api(?:/|$)|uploads(?:/|$)|docs(?:/|$)|openapi\.(?:json|yaml)$|healthz$) {
        proxy_pass $api_upstream$request_uri;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
